# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: agent-framework-agent-basic-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent-tools:
    host: azure.ai.toolbox
    tools:
      - type: web_search
        name: web_search
      - type: azure_ai_search
        name: search_conocimiento
        azure_ai_search:
          indexes:
            - project_connection_id: sectorial-search-conn
              index_name: sectorial-sharepoint-index
              query_type: vector_simple_hybrid
              top_k: 5
      - type: code_interpreter
        name: code_interpreter
        container: { type: auto }
  sectorial:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
    project: src/agent-framework-agent-basic-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
      - agent-tools
    kind: hosted
    name: sectorial
    description: Agente sectorial con búsqueda web y base de conocimiento
      (SharePoint indexado en Azure AI Search).
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_NAME
        value: agent-tools
      - name: DOCUMENT_INTELLIGENCE_ENDPOINT
        value: ${DOCUMENT_INTELLIGENCE_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1.0Gi
infra:
  provider: microsoft.foundry
